<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Album | Crochet Handcrafted Shop</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .album { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; max-width: 1000px; margin: 0 auto; padding: 0 12px; }
        .album button { border: 0; padding: 0; background: none; cursor: zoom-in; border-radius: 12px; overflow: hidden; }
        .album img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; margin: 0; border-radius: 12px; }
        .lb { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; z-index: 1000; flex-direction: column; }
        .lb.open { display: flex; }
        .lb-stage { flex: 1; min-height: 0; overflow: auto; display: flex; align-items: center; justify-content: center; }
        .lb-stage img { max-width: 100%; max-height: 100%; margin: 0; border-radius: 0; box-shadow: none; cursor: zoom-in; }
        .lb-stage.zoomed { display: block; }
        .lb-stage.zoomed img { max-width: none; max-height: none; width: 200%; cursor: zoom-out; }
        .lb-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; }
        .lb-bar button, .lb-bar a { background: #c9607f; color: #fff; border: 0; border-radius: 10px; padding: 10px 16px; font-size: 1rem; text-decoration: none; cursor: pointer; }
        .lb-bar a[hidden] { display: none; }
        [hidden] { display: none !important; }

        /* like / comment / download / favorite, Instagram style */
        .lb-info { color: #fff; padding: 8px 14px 0; max-height: 46vh; overflow-y: auto; text-align: left; }
        .ig-bar { display: flex; align-items: center; gap: 16px; }
        .ig-btn { display: inline-flex; align-items: center; gap: 5px; background: none !important; border: none; padding: 4px !important; cursor: pointer; color: #fff !important; text-decoration: none; font: inherit; }
        .ig-right { margin-left: auto; }
        .ig-like.on { color: #ff4d6d !important; }
        .ig-like.on svg { fill: #ff4d6d; }
        .ig-fav.on svg { fill: currentColor; }
        .ig-btn:disabled { opacity: .6; }
        .ig-n { font-size: .95rem; font-weight: bold; }
        .ig-likes { margin: 4px 0 6px; font-weight: bold; text-align: left; }
        .ig-comments { max-height: 150px; overflow-y: auto; }
        .ig-comment { margin: 0 0 6px; font-size: .95rem; overflow-wrap: anywhere; text-align: left; }
        .ig-form { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
        .ig-form input[type=text] { flex: 1 1 120px; min-width: 0; padding: 9px 12px; border: 1px solid rgba(255,255,255,.35); border-radius: 18px; background: rgba(255,255,255,.12); color: #fff; font: inherit; font-size: .95rem; }
        .ig-form input::placeholder { color: rgba(255,255,255,.65); }
        .ig-post { background: none !important; border: none; color: #ff9fb8 !important; font: inherit; font-weight: bold; cursor: pointer; padding: 0 6px !important; }
        .ig-form .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
        .lb-msg { margin: 0 0 8px; font-size: .9rem; color: #bfe8cb; text-align: left; }
        .lb-msg.err { color: #ffb3b3; }
    </style>
</head>

    <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var items = Array.prototype.slice.call(document.querySelectorAll("#album button"));
      var lb = $("lb"), stage = $("lb-stage"), img = $("lb-img"), order = $("lb-order");
      var likeBtn = $("lb-like"), cBtn = $("lb-cbtn"), favBtn = $("lb-fav"), dl = $("lb-dl");
      var likesTxt = $("lb-likes"), cCount = $("lb-ccount"), cBox = $("lb-cbox"), list = $("lb-comments");
      var form = $("lb-cform"), msg = $("lb-cmsg");
      // the name is optional; if he writes it once, it is remembered on this device
      try { $("lb-cname").value = localStorage.getItem("commentName") || ""; } catch (e) {}
      var onlyArticle = lb.querySelectorAll(".ig-only");
      var current = 0, art = null, photo = "";
      // site.js is loaded after this script, so the visitor id is asked at the moment it is needed
      function getVid() { return window.visitorId ? window.visitorId() : ""; }

      // Phones: a normal download goes to the Downloads / Files folder, often not to the gallery (Photos).
      // So on a phone (iPhone, iPad, Android) the photo is handed to the share sheet ("Save Image" puts it in the gallery).
      // The photo is prepared in advance, because the share must start right at the tap.
      var isPhone = /iPad|iPhone|iPod|Android/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      var shareFile = null, shareFor = "";
      function prepareShare(src) {
        shareFile = null; shareFor = src;
        if (!isPhone || !navigator.canShare || !window.File || !src) return;
        fetch(src).then(function (r) { return r.blob(); }).then(function (blob) {
          if (shareFor !== src) return;
          var f = new File([blob], "crochet-handcrafted-shop-" + src.replace(/\.jpe?g.*$/i, "").replace(/^.*\//, "") + ".jpeg", { type: blob.type || "image/jpeg" });
          if (navigator.canShare({ files: [f] })) shareFile = f;
        }).catch(function () {});
      }

      // The article (js/products.js) that owns this photo, or null if the photo is not in an article yet.
      function articleOf(item, ph) {
        if (typeof resolveProduct !== "function" || typeof PRODUCTS === "undefined") return null;
        var id = resolveProduct(item, ph);
        return id && PRODUCTS[id] && PRODUCTS[id].photos.indexOf(ph) !== -1 ? id : null;
      }
      function post(body) {
        return fetch("/api/social", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      }

      function drawLike(d) {
        likeBtn.setAttribute("aria-pressed", d.liked ? "true" : "false");
        likeBtn.classList.toggle("on", !!d.liked);
        likesTxt.textContent = d.likes > 0 ? d.likes + (d.likes === 1 ? " like" : " likes") : "Be the first to like this";
      }
      function drawFav() {
        var on = !!art && window.Fav && window.Fav.has(art);
        favBtn.setAttribute("aria-pressed", on ? "true" : "false");
        favBtn.classList.toggle("on", on);
        favBtn.setAttribute("aria-label", on ? "Remove from favorites" : "Save to favorites");
      }
      function drawComments(comments) {
        list.innerHTML = "";
        cCount.textContent = comments.length ? String(comments.length) : "";
        comments.forEach(function (c) {
          var row = document.createElement("p"); row.className = "ig-comment";
          var nm = document.createElement("strong"); nm.textContent = c.name;
          row.appendChild(nm); row.appendChild(document.createTextNode(" " + c.body));
          list.appendChild(row);
        });
      }
      function loadSocial(id) {
        fetch("/api/social?item=" + encodeURIComponent(id) + "&vid=" + encodeURIComponent(getVid()))
          .then(function (r) { return r.json(); })
          .then(function (d) { if (art !== id) return; if (d.ok) { drawLike(d); drawComments(d.comments || []); } else drawLike({ likes: 0 }); })
          .catch(function () { if (art === id) drawLike({ likes: 0 }); });
      }

      function show(i) {
        current = (i + items.length) % items.length;
        var b = items[current];
        stage.classList.remove("zoomed");
        img.src = b.dataset.src;
        img.alt = b.querySelector("img").alt;
        var item = b.dataset.item;
        photo = b.dataset.src.replace(/\.jpe?g$/i, "");
        art = articleOf(item, photo);

        if (art) {
          order.href = "product.html?item=" + encodeURIComponent(art).replace(/%20/g, "+") + "&photo=" + photo;
          order.hidden = false;
        } else if (item) {
          order.href = "order.html?item=" + encodeURIComponent(item).replace(/%20/g, "+") + "&photo=" + photo;
          order.hidden = false;
        } else { order.hidden = true; }

        dl.href = b.dataset.src;
        prepareShare(b.dataset.src);
        dl.setAttribute("download", "crochet-handcrafted-shop-" + photo + ".jpeg");

        // like / comments / favorite exist only for photos that belong to an article
        Array.prototype.forEach.call(onlyArticle, function (el) { el.hidden = !art; });
        cBox.hidden = true; msg.textContent = ""; list.innerHTML = ""; cCount.textContent = ""; likesTxt.textContent = "";
        likeBtn.classList.remove("on");
        drawFav();
        if (art) loadSocial(art);
      }
      function open(i) { show(i); lb.classList.add("open"); }
      function close() { lb.classList.remove("open"); }

      items.forEach(function (b, i) { b.addEventListener("click", function () { open(i); }); });
      img.addEventListener("click", function () { stage.classList.toggle("zoomed"); });
      $("lb-close").addEventListener("click", close);
      $("lb-prev").addEventListener("click", function () { show(current - 1); });
      $("lb-next").addEventListener("click", function () { show(current + 1); });
      document.addEventListener("keydown", function (e) {
        if (!lb.classList.contains("open")) return;
        if (e.key === "Escape") close();
        if (/^(INPUT|TEXTAREA)$/.test((e.target || {}).tagName || "")) return; // typing a comment: arrows stay in the text
        if (e.key === "ArrowLeft") show(current - 1);
        if (e.key === "ArrowRight") show(current + 1);
      });

      // ---- download (counted in the admin page, your own downloads are not) ----
      dl.addEventListener("click", function (e) {
        if (shareFile) { e.preventDefault(); navigator.share({ files: [shareFile] }).catch(function () {}); }
        if (!art) return;
        var owner = false;
        try { owner = localStorage.getItem("shopAdmin") === "1"; } catch (e) {}
        if (owner) return;
        fetch("/api/track", {
          method: "POST", headers: { "Content-Type": "application/json" }, keepalive: true,
          body: JSON.stringify({ kind: "download", vid: getVid(), item: art, photo: photo, device: window.innerWidth < 700 ? "phone" : "computer" })
        }).catch(function () {});
      });

      // ---- favorite ----
      favBtn.addEventListener("click", function () { if (art && window.Fav) { window.Fav.toggle(art); drawFav(); } });

      // ---- like ----
      likeBtn.addEventListener("click", function () {
        if (!art) return;
        var id = art;
        likeBtn.disabled = true;
        post({ action: "like", item: id, vid: getVid() })
          .then(function (r) { return r.json(); })
          .then(function (d) { if (d.ok && art === id) drawLike(d); })
          .catch(function () {})
          .then(function () { likeBtn.disabled = false; });
      });

      // ---- comments (appear after you approve them in the admin page) ----
      cBtn.addEventListener("click", function () {
        cBox.hidden = !cBox.hidden;
        if (!cBox.hidden) $("lb-ctext").focus();
      });
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        if (!art) return;
        var btn = form.querySelector("button");
        btn.disabled = true; msg.className = "lb-msg"; msg.textContent = "";
        post({ action: "comment", item: art, vid: getVid(), name: $("lb-cname").value.trim(), body: $("lb-ctext").value, website: $("lb-chp").value })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (res) {
            if (res.ok) {
              msg.textContent = res.j.message || "Thank you!"; $("lb-ctext").value = "";
              try { localStorage.setItem("commentName", $("lb-cname").value.trim()); } catch (e) {}
            }
            else { msg.className = "lb-msg err"; msg.textContent = res.j.error || "Something went wrong."; }
          })
          .catch(function () { msg.className = "lb-msg err"; msg.textContent = "Network problem. Please try again."; })
          .then(function () { btn.disabled = false; });
      });
    })();
    </script>
    <script src="js/site.js"></script>
</body>
</html>
