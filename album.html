<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Album | Crochet Handcrafted Shop</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .album { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; max-width: 1000px; margin: 0 auto; padding: 0 12px; }
        .album button { border: 0; padding: 0; background: none; cursor: zoom-in; border-radius: 12px; overflow: hidden; }
        .album img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; margin: 0; border-radius: 12px; }
        .lb { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; z-index: 1000; flex-direction: column; }
        .lb.open { display: flex; }
        .lb-stage { flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; }
        .lb-stage img { max-width: 100%; max-height: 100%; margin: 0; border-radius: 0; box-shadow: none; cursor: zoom-in; }
        .lb-stage.zoomed { display: block; }
        .lb-stage.zoomed img { max-width: none; max-height: none; width: 200%; cursor: zoom-out; }
        .lb-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; }
        .lb-bar button, .lb-bar a { background: #c9607f; color: #fff; border: 0; border-radius: 10px; padding: 10px 16px; font-size: 1rem; text-decoration: none; cursor: pointer; }
        .lb-bar a[hidden] { display: none; }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <p class="site-title"><a href="index.html">crochet handcrafted shop</a></p>

                    <li><a href="index.html">Home</a></li>
                    <li><a href="creation.html">Creation</a></li>

                    <li><a href="order.html">Order</a></li>

        <div class="lb-stage" id="lb-stage"><img id="lb-img" src="" alt=""></div>
        <div class="lb-bar">
            <button id="lb-prev" aria-label="Previous">&larr;</button>
            <a id="lb-order" href="order.html" hidden>Order this model</a>
            <button id="lb-close" aria-label="Close">Close</button>
            <button id="lb-next" aria-label="Next">&rarr;</button>

    <script>
    (function () {
      var items = Array.prototype.slice.call(document.querySelectorAll("#album button"));
      var lb = document.getElementById("lb"), stage = document.getElementById("lb-stage");
      var img = document.getElementById("lb-img"), order = document.getElementById("lb-order");
      var current = 0;

      function show(i) {
        current = (i + items.length) % items.length;
        var b = items[current];
        stage.classList.remove("zoomed");
        img.src = b.dataset.src;
        img.alt = b.querySelector("img").alt;
        var item = b.dataset.item;
        if (item) {
          var photo = b.dataset.src.replace(/\.jpe?g$/i, "");
          order.href = "order.html?item=" + encodeURIComponent(item).replace(/%20/g, "+") + "&photo=" + photo;
          order.hidden = false;
        } else { order.hidden = true; }
      }
      function open(i) { show(i); lb.classList.add("open"); }
      function close() { lb.classList.remove("open"); }

      items.forEach(function (b, i) { b.addEventListener("click", function () { open(i); }); });
      img.addEventListener("click", function () { stage.classList.toggle("zoomed"); });
      document.getElementById("lb-close").addEventListener("click", close);
      document.getElementById("lb-prev").addEventListener("click", function () { show(current - 1); });
      document.getElementById("lb-next").addEventListener("click", function () { show(current + 1); });
      document.addEventListener("keydown", function (e) {
        if (!lb.classList.contains("open")) return;
        if (e.key === "Escape") close();
        if (e.key === "ArrowLeft") show(current - 1);
        if (e.key === "ArrowRight") show(current + 1);
      });
    })();
    </script>
    <script src="js/site.js"></script>
</body>
</html>
