<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Item | Crochet Handcrafted Shop</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .pd { max-width: 900px; margin: 0 auto; padding: 0 14px 30px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; text-align: left; }
        .pd > div { min-width: 0; }
        .pd p { text-align: left; }
        .pd-main { display: block; width: 100%; max-width: 100%; height: auto; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 16px; margin: 0; }
        .pd-thumbs { display: flex; gap: 8px; margin-top: 8px; overflow-x: auto; }
        .pd-thumbs img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; margin: 0; cursor: pointer; border: 2px solid transparent; flex-shrink: 0; }
        .pd-thumbs img.on { border-color: var(--rose-fonce); }
        .pd label { display: block; font-weight: bold; margin: 12px 0 4px; color: var(--rose-fonce); }
        .pd select, .pd input { width: 100%; padding: 12px; border: 1px solid var(--rose); border-radius: 10px; font-size: 1rem; font-family: inherit; background: #fff; }
        .pd table { border-collapse: collapse; width: 100%; margin: 10px 0; }
        .pd td { padding: 6px 4px; border-bottom: 1px solid #f0d5dd; }
        .pd td:last-child { text-align: right; font-weight: bold; white-space: nowrap; }
        .pd-total { font-weight: bold; font-size: 1.15rem; margin: 12px 0; }
        .pd-msg { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: #e3f4e8; color: #1b5e34; }
        .pd-msg:empty { display: none; }
        .pd-msg.err { background: #fde4e4; color: #9b1c1c; }
        .pd-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; }
        .pd-act { font-family: inherit; font-size: 0.95rem; background: #fff; color: var(--rose-fonce); border: 2px solid var(--rose); border-radius: 20px; padding: 7px 14px; cursor: pointer; }
        .pd-act.on { background: var(--rose-fonce); color: #fff; border-color: var(--rose-fonce); }
        .pd-act:disabled { opacity: 0.6; }
        .pd-dl { display: inline-block; margin-top: 10px; text-decoration: none; }
        .pd-act .cnt { font-weight: bold; }
        .pd-social { max-width: 640px; margin: 34px auto 0; text-align: left; }
        .pd-social h2 { text-align: center; }
        .pd-comment { background: #fff; border-radius: 14px; padding: 10px 14px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
        .pd-comment p { margin: 0; text-align: left; }
        .pd-cwho { font-size: 0.85rem; color: #7a6a6e; }
        .pd-ctext { margin-top: 4px !important; overflow-wrap: anywhere; }
        .pd-none { text-align: center !important; color: #7a6a6e; }
        .pd-cform { margin-top: 18px; }
        .pd-cform label { display: block; font-weight: bold; color: var(--rose-fonce); margin: 10px 0 4px; }
        .pd-cform input[type=text], .pd-cform textarea { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid var(--rose); border-radius: 10px; font-family: inherit; font-size: 1rem; background: #fff; }
        .pd-cform .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
        .pd-note { font-size: 0.85rem; color: #7a6a6e; text-align: center; }
        .ig { margin-top: 14px; }
        .ig-bar { display: flex; align-items: center; gap: 16px; }
        .ig-btn { display: inline-flex; align-items: center; gap: 5px; background: none; border: none; padding: 4px; cursor: pointer; color: #2b2b2b; text-decoration: none; font: inherit; }
        .ig-btn:hover { color: var(--rose-fonce); }
        .ig-right { margin-left: auto; }
        .ig-like.on { color: #e0245e; }
        .ig-like.on svg { fill: #e0245e; }
        .ig-fav.on svg { fill: currentColor; }
        .ig-btn:disabled { opacity: 0.6; }
        .ig-n { font-size: 0.95rem; font-weight: bold; }
        .ig-likes { margin: 6px 0 8px !important; font-weight: bold; }
        .ig-comments { max-height: 220px; overflow-y: auto; }
        .ig-comment { margin: 0 0 6px !important; overflow-wrap: anywhere; font-size: 0.95rem; }
        .ig-form { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; border-top: 1px solid #f0d5dd; padding-top: 10px; }
        .ig-form input[type=text] { flex: 1 1 120px; min-width: 0; padding: 9px 10px; border: 1px solid var(--rose); border-radius: 18px; font: inherit; font-size: 0.95rem; background: #fff; }
        .ig-post { background: none; border: none; color: var(--rose-fonce); font: inherit; font-weight: bold; cursor: pointer; padding: 0 6px; }
        .ig-post:disabled { opacity: 0.5; }
        .ig .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
        .pd-note { font-size: 0.8rem; color: #7a6a6e; }
        /* layout: photo, then the price block, then the comments (on a phone); on a computer the comments stay under the photo */
        .pd { grid-template-areas: "photo info" "cm info"; grid-template-rows: auto 1fr; }
        .pd-photo { grid-area: photo; } .pd-info { grid-area: info; } .pd-cwrap { grid-area: cm; margin-top: 0; }
        .pd-ctitle { font-weight: bold; color: var(--rose-fonce); margin: 0 0 6px !important; }
        .ig-comments { max-height: 320px; }
        #pd-cform { flex-direction: column; flex-wrap: nowrap; gap: 8px; }
        #pd-cname { flex: none; width: 100%; box-sizing: border-box; height: 38px; padding: 6px 14px; font-size: 0.95rem; border-radius: 19px; }
        .ig-row { display: flex; align-items: flex-end; gap: 8px; }
        #pd-ctext { flex: 1; min-width: 0; box-sizing: border-box; min-height: 38px; max-height: 200px; padding: 8px 14px; font: inherit; font-size: 0.95rem; line-height: 1.35; border: 1px solid var(--rose); border-radius: 19px; background: #fff; resize: none; overflow-y: auto; }
        .ig-row .ig-post { padding: 8px 6px; }
        [hidden] { display: none !important; }
        @media (max-width: 700px) { .pd { grid-template-columns: 1fr; grid-template-areas: "photo" "info" "cm"; grid-template-rows: none; } }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <p class="site-title"><a href="index.html">crochet handcrafted shop</a></p>
            <nav class="main-nav" aria-label="main navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="creation.html" aria-current="page">Creation</a></li>
                    <li><a href="album.html">Album</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="order.html">Order</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <h1 id="pd-title">Item</h1>
        <div id="pd-box" class="pd">
            <div class="pd-photo">
                <img id="pd-main" class="pd-main" src="" alt="">
                <div id="pd-thumbs" class="pd-thumbs"></div>
                <div id="pd-post" class="ig" hidden>
                    <div class="ig-bar">
                        <button type="button" id="pd-like" class="ig-btn ig-like" aria-pressed="false" aria-label="Like"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg></button>
                        <button type="button" id="pd-cbtn" class="ig-btn" aria-label="Comment"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.2A8.4 8.4 0 1 1 21 11.5z"/></svg><span id="pd-ccount" class="ig-n"></span></button>
                        <a id="pd-download" class="ig-btn" href="#" download aria-label="Download this photo"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></a>
                        <button type="button" id="pd-fav" class="ig-btn ig-right ig-fav" aria-pressed="false" aria-label="Save to favorites"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>
                    </div>
                    <p class="ig-likes" id="pd-likes"></p>
                </div>
            </div>
            <div class="pd-info">
                <p id="pd-desc"></p>
                <table id="pd-table"></table>
                <label for="pd-size">Size</label>
                <select id="pd-size"></select>
                <div id="pd-color-box">
                    <label for="pd-color">Color</label>
                    <input type="text" id="pd-color" maxlength="100" placeholder="Write the color you want (ex: red and white)">
                </div>
                <label for="pd-qty">Quantity</label>
                <input type="number" id="pd-qty" min="1" max="100" value="1">
                <p class="pd-total" id="pd-total"></p>
                <button type="button" class="submit" id="pd-add">Add to cart</button>
                <p id="pd-msg" class="pd-msg" role="status"></p>
                <p><a href="creation.html">&larr; Back to creations</a></p>
            </div>
            <div id="pd-cwrap" class="pd-cwrap ig" hidden>
                <p class="pd-ctitle">Comments</p>
                    <div id="pd-comments" class="ig-comments"></div>
                    <form id="pd-cform" class="ig-form">
                        <input type="text" id="pd-cname" maxlength="40" placeholder="Your name (optional)" aria-label="Your name (optional)" autocomplete="name">
                        <div class="ig-row">
                            <textarea id="pd-ctext" rows="1" maxlength="500" placeholder="Add a comment..." aria-label="Add a comment" required></textarea>
                            <button type="submit" class="ig-post">Post</button>
                        </div>
                        <div class="hp" aria-hidden="true"><input type="text" id="pd-chp" tabindex="-1" autocomplete="off"></div>
                    </form>
                    <p id="pd-cmsg" class="pd-msg" role="status"></p>
                    <p class="pd-note">Comments appear after I have read and approved them.</p>
            </div>
        </div>

    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Crochet Handcrafted Shop. All rights reserved.</p>
        <p><a href="contact.html">contact us</a></p>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/catalog.js"></script>
    <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var name = resolveProduct(params.get("item"), params.get("photo")); // also understands old links (item=Dress&photo=31)
      var p = Object.prototype.hasOwnProperty.call(PRODUCTS, name) ? PRODUCTS[name] : null;
      var $ = function (id) { return document.getElementById(id); };
      if (!p) {
        $("pd-title").textContent = "Item not found";
        $("pd-box").hidden = true;
        return;
      }
      var money = function (n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " UGX"; };
      var photo = params.get("photo");
      if (p.photos.indexOf(photo) === -1) photo = p.photos[0];
      try { history.replaceState(null, "", "product.html?item=" + encodeURIComponent(name).replace(/%20/g, "+") + "&photo=" + photo); } catch (e) {}

      var label = labelOf(name);
      document.title = label + " | Crochet Handcrafted Shop";
      $("pd-title").textContent = label;
      $("pd-desc").textContent = p.desc;

      // price table + size list
      var table = $("pd-table"), sizeSel = $("pd-size");
      if (p.sizes) {
        Object.keys(p.sizes).forEach(function (s) {
          var tr = document.createElement("tr");
          var a = document.createElement("td"); a.textContent = s;
          var b = document.createElement("td"); b.textContent = money(p.sizes[s]);
          tr.appendChild(a); tr.appendChild(b); table.appendChild(tr);
          var o = document.createElement("option"); o.value = s; o.textContent = s; sizeSel.appendChild(o);
        });
      } else {
        var tr = document.createElement("tr");
        var a = document.createElement("td"); a.textContent = "Price";
        var b = document.createElement("td"); b.textContent = money(p.price);
        tr.appendChild(a); tr.appendChild(b); table.appendChild(tr);
        sizeSel.parentNode.removeChild(sizeSel.previousElementSibling);
        sizeSel.parentNode.removeChild(sizeSel);
      }

      // color: nothing is proposed, each customer writes the color he wants
      var colorBox = $("pd-color-box"), colorInput = $("pd-color");
      var hasColors = !!(p.colors && p.colors.length); // true = this article needs a color (colors: [] in products.js = no color asked)
      if (!hasColors) colorBox.hidden = true;

      // gallery
      var main = $("pd-main"), thumbs = $("pd-thumbs");
      function setPhoto(id) {
        photo = id; main.src = id + ".jpeg"; main.alt = label;
        Array.prototype.forEach.call(thumbs.children, function (t) { t.classList.toggle("on", t.dataset.id === id); });
      }
      p.photos.forEach(function (id) {
        var t = document.createElement("img");
        t.src = id + ".jpeg"; t.alt = label; t.dataset.id = id; t.loading = "lazy";
        t.addEventListener("click", function () { setPhoto(id); });
        thumbs.appendChild(t);
      });
      setPhoto(photo);

      function unit() { return p.sizes ? p.sizes[sizeSel.value] : p.price; }
      function total() {
        var q = parseInt($("pd-qty").value, 10);
        $("pd-total").textContent = q > 0 ? "Total: " + money(unit() * q) : "";
      }
      if (p.sizes) sizeSel.addEventListener("change", total);
      $("pd-qty").addEventListener("input", total);
      total();

      // add to cart (saved in this browser; the cart page comes next)
      $("pd-add").addEventListener("click", function () {
        var q = parseInt($("pd-qty").value, 10);
        if (!(q >= 1 && q <= 100)) return;
        var size = p.sizes ? sizeSel.value : "";
        var colors = "";
        var msg = $("pd-msg");
        if (hasColors) {
          colors = colorInput.value.trim();
          if (!colors) {
            msg.className = "pd-msg err";
            msg.textContent = "Please write the color you want.";
            colorInput.focus();
            return;
          }
        }
        var cart = [];
        try { cart = JSON.parse(localStorage.getItem("cart") || "[]"); } catch (e) {}
        var found = cart.filter(function (l) { return l.item === name && l.size === size && l.photo === photo && (l.colors || "") === colors; })[0];
        if (found) found.qty = Math.min(100, found.qty + q);
        else cart.push({ item: name, size: size, qty: q, photo: photo, colors: colors });
        try { localStorage.setItem("cart", JSON.stringify(cart)); } catch (e) {}
        msg.className = "pd-msg";
        msg.textContent = "Added to your cart. You can choose another item or ";
        var go = document.createElement("a"); go.href = "cart.html"; go.textContent = "open your cart"; msg.appendChild(go);
        msg.appendChild(document.createTextNode("."));
        if (window.updateCartBadge) window.updateCartBadge();
      });
    })();
    </script>
    <script src="js/site.js"></script>
    <script src="js/social.js"></script>
</body>
</html>
